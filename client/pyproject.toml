[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-sharing-client"
version = "0.1.0"
description = "File sharing client components"
requires-python = ">=3.11"
dependencies = ["file-sharing-common==0.1.0", "tkinterdnd2>=0.4.2"]

[project.scripts]
file-sharing-client = "file_sharing_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
