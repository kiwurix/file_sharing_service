[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-sharing-server"
version = "0.1.0"
description = "File sharing server components"
requires-python = ">=3.11"
dependencies = ["file-sharing-common==0.1.0", "cryptography>=43.0"]

[project.scripts]
file-sharing-server = "file_sharing_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
